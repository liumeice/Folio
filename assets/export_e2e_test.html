<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>export_e2e_test</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; max-width: 860px; margin: 40px auto; padding: 0 24px; line-height: 1.7; color: #24292e; }
h1 { font-size: 2em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
h2 { font-size: 1.5em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
h3 { font-size: 1.25em; }
code { background: #f6f8fa; padding: 0.15em 0.4em; border-radius: 3px; font-size: 0.9em; font-family: Consolas, monospace; }
pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow: auto; }
pre code { background: none; padding: 0; font-size: 0.9em; }
blockquote { border-left: 4px solid #dfe2e5; padding: 0 16px; color: #6a737d; margin: 0; }
table { border-collapse: collapse; width: 100%; margin: 16px 0; }
table th, table td { border: 1px solid #dfe2e5; padding: 8px 13px; text-align: left; }
table th { background: #f6f8fa; font-weight: 600; }
table tbody tr:nth-child(odd) { background: #f6f8fa; }
img { max-width: 100%; height: auto; }
a { color: #0366d6; text-decoration: none; }
a:hover { text-decoration: underline; }
hr { border: 0; height: 1px; background: #eaecef; margin: 24px 0; }
ul, ol { padding-left: 2em; }
li { margin: 4px 0; }
.callout { padding: 12px 16px; margin: 16px 0; border-left: 4px solid; border-radius: 4px; }
.callout-title { margin: 0 0 8px 0; }
.callout-note { border-color: #0969da; background: #ddf4ff; }
.callout-tip { border-color: #1a7f37; background: #dafbe1; }
.callout-important { border-color: #8250df; background: #f0e5ff; }
.callout-warning { border-color: #9a6700; background: #fff8c5; }
.callout-caution { border-color: #cf222e; background: #ffebe9; }
del { text-decoration: line-through; }
mark { background: #fff3b0; padding: 0.1em 0.3em; border-radius: 2px; }
.footnote { font-size: 0.85em; color: #6a737d; }
</style>
</head>
<body>
<h1>E2E 导出测试</h1>
<p>这是 <strong>粗体</strong>、<em>斜体</em>、<del>删除线</del>、<mark>高亮</mark> 与 <code>行内代码</code>，链接 <a href="https://www.baidu.com">百度</a> 与裸链 <a href="https://example.com">https://example.com</a> 。</p>
<h2>代码块</h2>
<pre><code class="language-c">int main(void) { return 0 &lt; 1 &amp;&amp; 2 &gt; 1; }
</code></pre>
<h2>表格</h2>
<table>
<thead>
<tr><th>列一</th><th>列二</th></tr>
</thead>
<tbody>
<tr><td>a&lt;b</td><td>c&amp;d</td></tr>
</tbody>
</table>
<h2>列表</h2>
<ul>
<li>普通项</li>
<li><input type="checkbox" checked disabled> 已完成</li>
<li><input type="checkbox" disabled> 待办</li>
</ul>
<ol>
<li>有序项</li>
</ol>
<div class="callout callout-note">
<p class="callout-title"><strong>Note</strong></p>
<p>这是 callout 内容</p>
</div>
<blockquote>
<p>普通引用</p>
</blockquote>
<hr>
<p><img src="missing.png" alt=""></p>
</body>
</html>
