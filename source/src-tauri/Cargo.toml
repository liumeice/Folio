[package]
name = "folio-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Folio 桌面壳：Tauri 2 命令层 + 单实例 + 深度链接 + 文件关联"

[lib]
name = "folio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# release.sh 注入 FOLIO_VERSION 时由 build.rs 原地改 tauri 的 resource.rc 再 rc.exe 重编
# （winres 直挂会与之资源重复→LNK1123，故只借 cc 的 VS 探测找 rc.exe）
[target.'cfg(windows)'.build-dependencies]
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
urlencoding.workspace = true
folio-core.workspace = true
folio-db.workspace = true
folio-fs.workspace = true
folio-search.workspace = true

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
