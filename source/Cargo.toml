[workspace]
resolver = "2"
members = [
  "crates/folio-core",
  "crates/folio-db",
  "crates/folio-fs",
  "crates/folio-search",
  "src-tauri",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
urlencoding = "2"

folio-core = { path = "crates/folio-core" }
folio-db = { path = "crates/folio-db" }
folio-fs = { path = "crates/folio-fs" }
folio-search = { path = "crates/folio-search" }

# dev profile 保持可调试；release 对齐原型契约（LTO fat）
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
